
name: Build

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          
      # package-lock.json is out of sync with package.json (platform packages
      # are added via bun), so `npm ci` fails. `npm install` resolves instead.
      - name: Install Dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
        
      - name: Build
        run: npm run build
        
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 1
